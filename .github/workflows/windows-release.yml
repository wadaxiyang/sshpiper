name: Fork Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SSHPiper version (without v)
        required: true
        default: '1.6.1'

permissions:
  contents: write

concurrency:
  group: fork-windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'wadaxiyang/sshpiper'
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
      CGO_ENABLED: '0'
    steps:
      - name: Preserve source bytes for embedded assets
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            go.sum
            cmd/sshpiperd/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      - name: Build release
        run: ./scripts/build-windows.ps1 -Version $env:RELEASE_VERSION
      - name: Daemon and crypto regression tests
        run: |
          go -C cmd/sshpiperd test -count=1 -timeout 5m ./...
          if ($LASTEXITCODE) { throw 'Daemon tests failed' }
          go -C cmd/sshpiperd test -count=1 -timeout 5m golang.org/x/crypto/ssh/...
          if ($LASTEXITCODE) { throw 'Crypto tests failed' }
          go test -count=1 -timeout 5m -tags full ./...
          if ($LASTEXITCODE) { throw 'Plugin and admin tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: sshpiperd-windows-release
          path: |
            dist/windows-v*/*.zip
            dist/windows-v*/*.zip.sha256
          if-no-files-found: error
      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          $tag = "v$env:RELEASE_VERSION"
          $existing = git tag --list $tag
          if ($existing) { throw "Tag $tag already exists; never overwrite a released version." }
          $assets = @(Get-ChildItem "dist/windows-v$env:RELEASE_VERSION/*.zip", "dist/windows-v$env:RELEASE_VERSION/*.zip.sha256" | ForEach-Object FullName)
          gh release create $tag @assets --target $env:GITHUB_SHA --title "SSHPiper $tag - Windows x64 fork fixes" --notes-file RELEASE-WINDOWS.md
          if ($LASTEXITCODE) { throw 'Release publication failed' }
